[template]
cargo_generate_version = ">=0.18.0"
# Not copied into generated projects.
ignore = [
    "target",
    "dist",
    "crates/web/dist",
    ".wrangler",
    "node_modules",
    "Cargo.lock",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    # CI that tests this template itself (runs cargo generate); meaningless in a generated project.
    ".github/workflows/template.yml",
]
# Copied verbatim: GitHub `${{ }}` expressions, `{{` in format! strings and binaries break Liquid.
exclude = [
    ".github/**",
    "crates/shared/src/export.rs",
    "**/*.png",
    "**/*.ico",
    "**/*.icns",
    "**/*.woff2",
]

[placeholders.include_tauri_desktop]
type = "bool"
# false = pure serverless edge build: static SSR + WASM hydration only (no Tauri, CSR, Trunk or
# mobile targets). This replaces the former efficient-leptos-edge-template.
prompt = "Include the Tauri v2 desktop/mobile runner? (No = pure serverless edge site: static SSR + hydration only)"
default = true

[placeholders.include_pwa]
type = "bool"
prompt = "Include offline PWA service worker and manifest support?"
default = true

[placeholders.include_cloudflare_pages]
type = "bool"
prompt = "Include Cloudflare Pages deployment configuration (wrangler.toml, _headers, deploy.sh)?"
default = true

[conditional.'!include_tauri_desktop']
ignore = [
    "crates/desktop",
    "crates/app/src/tauri_bridge.rs",
    "crates/web/index.html",
    "Trunk.toml",
    ".github/workflows/desktop.yml",
    "scripts/build-android.sh",
    "scripts/build-android.ps1",
    "scripts/build-ios.sh",
    "scripts/build-ios.ps1",
]

[conditional.'!include_pwa']
ignore = ["crates/web/public/sw.js", "crates/web/public/manifest.json"]

[conditional.'!include_cloudflare_pages']
ignore = ["wrangler.toml", "crates/web/public/_headers", "deploy.sh"]
